services:
  patente-quiz:
    build: .
    container_name: patente-quiz
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Letta dal file .env (vedi .env.example)
      PATENTE_PASSWORD: ${PATENTE_PASSWORD:?imposta PATENTE_PASSWORD nel file .env}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./data:/data     # database + immagini: da salvare nei backup
